[package]
name = "strawberry-chat-client"
version = "1.5.1"
edition = "2024"
description = "Official Strawberry Chat Client based on Rust"

[dependencies]
libstrawberry = { version = "1.4.0", features = ["stbchat", "notifications", "strawberryid"] }
tokio = { version = "1.47.1", features = ["full"] }
reqwest = "0.12.23"
rustyline = "17.0.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34-deprecated"
serde_json = "1.0.143"
eyre = "0.6.12"
rprompt = "2.2.0"
socket2 = "0.6.0"
futures = "0.3.31"

[profile.release]
opt-level = 'z'
strip = true
lto = true
panic = "abort"

[profile.dev]
panic = "abort"
